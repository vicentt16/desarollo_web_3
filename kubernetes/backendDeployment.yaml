apiVersion: v1
kind: Service
metadata:
  name: mongo-sevice
spec:
  selector:
    app: mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: fast-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-backend
  template:
    metadata:
      labels:
        app: fast-backend
    spec:
      containers:
      - name: backend-fast
        image: backend_productos:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
